# organize-downloads rules.conf
#
# This file is read by organize-downloads.sh on EVERY run. install.sh copies
# it to ~/.config/organize-downloads/rules.conf (only if none exists yet);
# edit THAT copy to customize sorting. No reinstall or reload needed.
#
# Your rules are loaded AFTER the built-in defaults and override them
# (last match wins). The built-in defaults live in organize-downloads.sh
# (load_default_rules) and cover Images, Videos, Audio, Documents, PDFs,
# Spreadsheets, Installers, Archives, Code, Design, Fonts, Ebooks,
# Subtitles, HTML, Calendar, Contacts, Torrents, Certificates, WhatsApp,
# and Screenshots.
#
# Rule syntax (one per line; # comments and blank lines are fine):
#
#   ext <Folder> <ext1> [ext2 ...]
#       Send files with these extensions (case-insensitive) to <Folder>.
#       The folder is created automatically on first use. This is also how
#       you MAKE a new folder: name it and list its extensions.
#
#   prefix <Folder> <literal prefix>
#       Send files whose name starts with the literal prefix to <Folder>.
#       Prefix rules run before extension rules.
#
# Settings:
#
#   other_to <Folder>          Folder for files with no extension.
#                              Default: Other
#   dynamic_folders on|off     When a file matches no rule, auto-create a
#                              folder named after its extension (report.stl
#                              lands in STL/). Default: on. With off,
#                              unmatched files go to the other_to folder.
#   compat_links on|off        After moving a file, leave a hidden symlink
#                              at the old path so the browser's Open /
#                              Show in Finder buttons still work.
#                              Default: on
#   compat_link_days <N>       Remove those symlinks after N days.
#                              Default: 7
#
# Folder names may contain letters, digits, dot, dash, and underscore, and
# must not start with a dot.
#
# ---------- Examples (uncomment and adapt) ----------
#
# A new folder for 3D printing files:
# ext 3D-Prints stl 3mf gcode obj
#
# Re-route an extension that the defaults send elsewhere
# (csv goes to Spreadsheets by default, send it to Data instead):
# ext Data csv
#
# Invoices your bank names "RE-2026-001.pdf":
# prefix Invoices RE-
#
# Send everything unknown to one folder instead of per-type folders:
# dynamic_folders off
# other_to Unsorted
